[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masonite-framework"
description = "Masonite is a modern and developer centric Python web framework."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Joe Mancuso" }]
maintainers = [{ name = "Eduardo Aguad", email = "contact@masonite.dev" }]
keywords = ["Masonite", "masonite-framework", "Python", "Web Framework"]
dynamic = ["version"]
dependencies = [
    "inflection>=0.5,<0.6",
    "exceptionite>=3,<4",
    "pendulum>=3,<4",
    "jinja2>=3.1,<4",
    "cleo>=0.8.1,<0.9",
    "hupper>=1.12,<2",
    "bcrypt>=4,<6",
    "whitenoise>=6.6,<7",
    "python-dotenv>=1,<2",
    "masonite-framework-orm>=3.0.1,<4",
    "hashids>=1.3,<2",
    "cryptography>=46.0.7,<49",
    "tldextract>=5,<6",
    "dotty_dict>=1.3,<2",
    "pyjwt>=2.8,<3",
    "questionary>=2,<3",
    "werkzeug>=3,<4",
    "watchdog>=4,<7",
    "multipart>=1.2,<2",
    "requests>=2.28,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/masonitedev/masonite"
Documentation = "https://docs.masonite.dev"
Source = "https://github.com/masonitedev/masonite"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "time-machine>=2,<3",
    "coverage",
    "redis",
    "boto3",
    "pusher",
    "pymemcache",
    "vonage>=3.16,<4",
    "slackblocks>=1,<2",
    "argon2-cffi>=23,<26",
    "pwnedapi>=1,<2",
    "responses>=0.25,<1",
    "phonenumbers>=8.12,<10",
]
vonage = ["vonage>=3.16,<4", "phonenumbers>=8.12,<10"]
argon2 = ["argon2-cffi>=23,<26"]
dev = ["flake8", "black", "isort"]

[project.scripts]
masonite = "masonite.commands.Entry:application.run"
project = "masonite.commands.Entry:application.run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "masonite.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["masonite.skeleton*"]

[tool.setuptools.package-data]
masonite = ["skeleton/**/*", "skeleton/**/.*", "skeleton/.*"]
